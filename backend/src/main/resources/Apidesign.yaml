openapi: 3.0.3
info:
  title: Club System Plus API Design
  version: 0.1.0
  description: >
    Club System Plus REST API design draft. The backend uses /api as the
    servlet context path, so all paths below are relative to /api.

servers:
  - url: http://localhost:8080/api
    description: Local Spring Boot server

tags:
  - name: System
    description: Health check and system metadata
  - name: Auth
    description: Registration, login, token and current user APIs
  - name: Users
    description: User profile and account management
  - name: Departments
    description: Club departments and department members
  - name: Activities
    description: Activity publishing, listing and detail APIs
  - name: ActivityRegistration
    description: Activity registration and ticket grabbing APIs
  - name: Coupons
    description: Coupon batch, claiming and user coupon APIs
  - name: Dashboard
    description: Admin dashboard statistics
  - name: AiChat
    description: RAG chat APIs for courses, activities and club information
  - name: Knowledge
    description: Course PDF and system knowledge base management

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      security: []
      responses:
        "200":
          description: Backend is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthToken"

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AuthToken"

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current login user
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserProfile"

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Get user profile by ID
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/UserProfile"
    put:
      tags:
        - Users
      summary: Update user profile
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /organization/departments:
    get:
      tags:
        - Departments
      summary: List departments
      responses:
        "200":
          description: Department list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Department"
    post:
      tags:
        - Departments
      summary: Create department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentRequest"
      responses:
        "200":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /organization/departments/{departmentId}:
    put:
      tags:
        - Departments
      summary: Update department
      parameters:
        - $ref: "#/components/parameters/DepartmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentRequest"
      responses:
        "200":
          description: Department updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /organization/departments/{departmentId}/disable:
    patch:
      tags:
        - Departments
      summary: Disable department
      parameters:
        - $ref: "#/components/parameters/DepartmentId"
      responses:
        "200":
          description: Department disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /organization/departments/{departmentId}/enable:
    patch:
      tags:
        - Departments
      summary: Enable department
      parameters:
        - $ref: "#/components/parameters/DepartmentId"
      responses:
        "200":
          description: Department enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /organization/members:
    get:
      tags:
        - Departments
      summary: List members by organization scope
      parameters:
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ClubMember"
    post:
      tags:
        - Departments
      summary: Add or move member to department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignMemberDepartmentRequest"
      responses:
        "200":
          description: Member assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /organization/users:
    get:
      tags:
        - Departments
      summary: List all registered users with pagination
      parameters:
        - name: keyword
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /organization/members/status:
    patch:
      tags:
        - Departments
      summary: Update member status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberStatusRequest"
      responses:
        "200":
          description: Member status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /organization/leaders:
    get:
      tags:
        - Departments
      summary: List department leaders by organization scope
      parameters:
        - name: departmentId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Department leader list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/DepartmentLeader"
    post:
      tags:
        - Departments
      summary: Appoint department leader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignDepartmentLeaderRequest"
      responses:
        "200":
          description: Department leader appointed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
        - Departments
      summary: Remove department leader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignDepartmentLeaderRequest"
      responses:
        "200":
          description: Department leader removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /activities:
    get:
      tags:
        - Activities
      summary: List activities
      security: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ActivityStatus"
        - name: departmentId
          in: query
          schema:
            type: integer
            format: int64
        - name: keyword
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ActivityPage"
    post:
      tags:
        - Activities
      summary: Create activity draft or submit activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRequest"
      responses:
        "200":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /activities/{activityId}:
    get:
      tags:
        - Activities
      summary: Get activity detail
      security: []
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Activity detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ActivityDetail"
    put:
      tags:
        - Activities
      summary: Update activity draft or create change request
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityRequest"
      responses:
        "200":
          description: Activity update submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /activities/{activityId}/submit:
    post:
      tags:
        - Activities
      summary: Submit activity draft for review
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Activity submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /activities/{activityId}/review:
    post:
      tags:
        - Activities
      summary: Review activity request
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Review completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /activities/{activityId}/registrations:
    post:
      tags:
        - ActivityRegistration
      summary: Register for an activity
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Registration succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
    delete:
      tags:
        - ActivityRegistration
      summary: Cancel current user's registration
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Registration cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /activities/{activityId}/tickets/grab:
    post:
      tags:
        - ActivityRegistration
      summary: Grab limited activity ticket
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200":
          description: Ticket grabbed or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /coupons/batches:
    get:
      tags:
        - Coupons
      summary: List coupon batches
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Coupon batch page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CouponBatchPage"
    post:
      tags:
        - Coupons
      summary: Create coupon batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponBatchRequest"
      responses:
        "200":
          description: Coupon batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /coupons/batches/{batchId}/claim:
    post:
      tags:
        - Coupons
      summary: Claim coupon from batch
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Coupon claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /users/me/coupons:
    get:
      tags:
        - Coupons
      summary: List current user's coupons
      responses:
        "200":
          description: User coupon list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserCoupon"

  /dashboard/overview:
    get:
      tags:
        - Dashboard
      summary: Get admin dashboard overview
      responses:
        "200":
          description: Dashboard overview statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DashboardOverview"

  /ai/chat:
    post:
      tags:
        - AiChat
      summary: Ask the RAG assistant
      description: >
        Routes the question to course PDF knowledge, internal system data, or
        both. Dynamic activity and registration questions should query business
        tables before generating the final answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: AI answer with references
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiChatResponse"

  /ai/sessions:
    get:
      tags:
        - AiChat
      summary: List current user's AI chat sessions
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Chat session page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AiChatSessionPage"

  /ai/sessions/{sessionId}/messages:
    get:
      tags:
        - AiChat
      summary: List AI chat messages in a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/AiChatMessage"

  /admin/knowledge/pdf/upload:
    post:
      tags:
        - Knowledge
      summary: Upload course PDF material
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - courseId
                - file
              properties:
                courseId:
                  type: integer
                  format: int64
                visibility:
                  $ref: "#/components/schemas/KnowledgeVisibility"
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: PDF uploaded and parsing task created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CourseMaterial"

  /admin/knowledge/pdf/{materialId}/reindex:
    post:
      tags:
        - Knowledge
      summary: Rebuild chunks and embeddings for a PDF material
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Reindex task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /admin/knowledge/materials:
    get:
      tags:
        - Knowledge
      summary: List imported course materials
      parameters:
        - name: courseId
          in: query
          schema:
            type: integer
            format: int64
        - name: parserStatus
          in: query
          schema:
            $ref: "#/components/schemas/ParserStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Course material page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CourseMaterialPage"

  /admin/knowledge/chunks:
    get:
      tags:
        - Knowledge
      summary: List knowledge chunks
      parameters:
        - name: documentId
          in: query
          schema:
            type: integer
            format: int64
        - name: sourceType
          in: query
          schema:
            $ref: "#/components/schemas/KnowledgeSourceType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Knowledge chunk page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/KnowledgeChunkPage"

  /admin/knowledge/system/sync:
    post:
      tags:
        - Knowledge
      summary: Sync system content into knowledge base
      description: Syncs club introduction, departments, activity rules, FAQs and admin manuals.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemKnowledgeSyncRequest"
      responses:
        "200":
          description: System knowledge sync task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"

  /admin/knowledge/system/sources:
    get:
      tags:
        - Knowledge
      summary: List system knowledge sources
      responses:
        "200":
          description: System knowledge sources
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SystemKnowledgeSource"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    BatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          nullable: true
        traceId:
          type: string
          example: 01J9Z3X2Y7M6K8

    PageResponse:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        pages:
          type: integer

    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 8
        email:
          type: string
          format: email
        nickname:
          type: string
          maxLength: 50

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    AuthToken:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        departmentId:
          type: integer
          format: int64
          nullable: true

    UserUpdateRequest:
      type: object
      properties:
        nickname:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string

    Department:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED

    DepartmentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string

    AssignMemberDepartmentRequest:
      type: object
      required:
        - userId
        - departmentId
      properties:
        userId:
          type: integer
          format: int64
        departmentId:
          type: integer
          format: int64

    UpdateMemberStatusRequest:
      type: object
      required:
        - userId
        - status
      properties:
        userId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/MemberStatus"

    AssignDepartmentLeaderRequest:
      type: object
      required:
        - userId
        - departmentId
      properties:
        userId:
          type: integer
          format: int64
        departmentId:
          type: integer
          format: int64

    ClubMember:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        departmentId:
          type: integer
          format: int64
        departmentName:
          type: string
        joinedAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/MemberStatus"
        departmentLeader:
          type: boolean

    DepartmentLeader:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        departmentId:
          type: integer
          format: int64
        departmentName:
          type: string
        appointedAt:
          type: string
          format: date-time

    MemberStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED
        - REMOVED

