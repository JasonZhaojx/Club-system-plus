spring:
  application:
    name: backend
  profiles:
    default: dev

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    swagger-enabled: true
    trust-forward-headers: false
  rate-limit:
    enabled: true
    capacity: 120
    refill-per-second: 60
  rabbitmq:
    coupon-claim-exchange: club.coupon.exchange
    coupon-claim-queue: club.coupon.claim.queue
    coupon-claim-routing-key: coupon.claim
  business-rate-limit:
    enabled: true
    coupon-claim-limit: 1
    coupon-claim-window-seconds: 3
    activity-register-limit: 1
    activity-register-window-seconds: 3
    email-cooldown-limit: 1
    email-cooldown-window-seconds: 60
    email-hourly-limit: 5
    email-hourly-window-seconds: 3600
    email-ip-hourly-limit: 20
    email-ip-hourly-window-seconds: 3600
    login-username-limit: 10
    login-username-window-seconds: 300
    login-ip-limit: 50
    login-ip-window-seconds: 300
  sentinel:
    enabled: true
    coupon-claim-qps: 80
    coupon-claim-hot-batch-qps: 30
    activity-register-qps: 80
    activity-register-hot-activity-qps: 30
    email-code-qps: 20
    email-code-hot-email-qps: 3
    exception-ratio: 0.5
    min-request-amount: 20
    stat-interval-ms: 10000
    time-window-seconds: 10
  email-code:
    ttl-seconds: 600
    max-verify-attempts: 5
    subject: Club System Plus password reset code
  storage:
    provider: ${STORAGE_PROVIDER:minio}
  file-storage:
    max-image-size-bytes: 5242880
