spring:
  application:
    name: backend
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-development-secret-at-least-32-chars}
    expiration-seconds: 86400
  rate-limit:
    enabled: true
    capacity: 120
    refill-per-second: 60
  rabbitmq:
    coupon-claim-exchange: club.coupon.exchange
    coupon-claim-queue: club.coupon.claim.queue
    coupon-claim-routing-key: coupon.claim
